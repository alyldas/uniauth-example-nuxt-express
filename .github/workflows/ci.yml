name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on:
      - self-hosted
      - linux
      - x64
      - node22
      - uniauth
      - ci
    timeout-minutes: 25
    defaults:
      run:
        working-directory: uniauth-example-nuxt-express
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-core
          path: uniauth-core
      - name: Checkout drizzle
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-drizzle
          path: uniauth-drizzle
      - name: Checkout express
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-express
          path: uniauth-express
      - name: Checkout nuxt
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-nuxt
          path: uniauth-nuxt
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: uniauth-example-nuxt-express
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uniauth-example-nuxt-express/package-lock.json
      - name: Build core
        working-directory: uniauth-core
        run: npm ci && npm run build
      - name: Build drizzle
        working-directory: uniauth-drizzle
        run: npm ci && npm run build
      - name: Build express
        working-directory: uniauth-express
        run: npm ci && npm run build
      - name: Build nuxt
        working-directory: uniauth-nuxt
        run: npm ci && npm run build
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check

  live-smoke:
    name: Live smoke
    runs-on:
      - self-hosted
      - linux
      - x64
      - node22
      - uniauth
      - ci
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uniauth_example
          POSTGRES_USER: uniauth
          POSTGRES_PASSWORD: uniauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniauth -d uniauth_example"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: uniauth-example-nuxt-express
    env:
      DATABASE_URL: postgres://uniauth:uniauth@127.0.0.1:5432/uniauth_example
      EXPRESS_HOST: 127.0.0.1
      EXPRESS_PORT: 4000
      NUXT_AUTH_BACKEND_ORIGIN: http://127.0.0.1:4000
      NUXT_ORIGIN: http://127.0.0.1:3000
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-core
          path: uniauth-core
      - name: Checkout drizzle
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-drizzle
          path: uniauth-drizzle
      - name: Checkout express
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-express
          path: uniauth-express
      - name: Checkout nuxt
        uses: actions/checkout@v6
        with:
          repository: alyldas/uniauth-nuxt
          path: uniauth-nuxt
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: uniauth-example-nuxt-express
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uniauth-example-nuxt-express/package-lock.json
      - name: Build core
        working-directory: uniauth-core
        run: npm ci && npm run build
      - name: Build drizzle
        working-directory: uniauth-drizzle
        run: npm ci && npm run build
      - name: Build express
        working-directory: uniauth-express
        run: npm ci && npm run build
      - name: Build nuxt
        working-directory: uniauth-nuxt
        run: npm ci && npm run build
      - name: Install dependencies
        run: npm ci
      - name: Apply database schema
        run: npm run db:apply-schema
      - name: Run live smoke
        run: |
          npm run dev &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/health
          curl -fsS http://127.0.0.1:3000 >/dev/null
          npm run smoke:auth
