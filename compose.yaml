services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uniauth_example
      POSTGRES_USER: uniauth
      POSTGRES_PASSWORD: uniauth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniauth -d uniauth_example"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
